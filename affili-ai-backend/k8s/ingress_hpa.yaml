apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: affili-ai-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: affili-ai-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: affili-ai-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.affili-ai.hub
    secretName: affili-ai-tls
  rules:
  - host: api.affili-ai.hub
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: affili-ai-api-service
            port:
              number: 80
