version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: affili-ai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: affili_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend
  backend:
    build: .
    container_name: affili-ai-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/affili_ai_db
      API_BASE_URL: http://localhost:8000
      SECRET_KEY: your-secret-key-change-in-production
      ENCRYPTION_KEY: your-32-byte-encryption-key
      AGENT_API_KEY: agent-secret-key
      DEBUG: "true"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  default:
    name: affili-ai-network
