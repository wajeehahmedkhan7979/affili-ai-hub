services:
  # PostgreSQL database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: affili-ai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: affili_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affili-ai-network

  # FastAPI backend
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    image: affili-ai-backend:latest
    container_name: affili-ai-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/affili_ai_db
      API_BASE_URL: http://backend:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - affili-ai-network

  # Playwright Worker (task executor)
  worker:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: affili-ai-worker:latest
    container_name: affili-ai-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/affili_ai_db?host=postgres
      AGENT_CLIENT_ID: docker-worker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - affili-ai-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  affili-ai-network:
    driver: bridge
